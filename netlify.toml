# Build settings
[build]
  command = "npm run build:web"
  publish = "dist"

[functions]
  directory = "netlify/functions"


[build.environment]
  # Firebase API keys are designed to be public (client-side)
  # They're protected by Firebase Security Rules, not by being secret
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

# Redirect /api/* to Netlify Functions (MUST be before SPA catch-all)
[[redirects]]
  from = "/api/auth"
  to = "/.netlify/functions/auth"
  status = 200
  force = true

[[redirects]]
  from = "/api/save-match"
  to = "/.netlify/functions/save-match"
  status = 200
  force = true

[[redirects]]
  from = "/api/analyze-linkedin"
  to = "/.netlify/functions/analyze-linkedin"
  status = 200
  force = true

[[redirects]]
  from = "/api/send-email"
  to = "/.netlify/functions/send-email"
  status = 200
  force = true

[[redirects]]
  from = "/api/subscribe"
  to = "/.netlify/functions/subscribe"
  status = 200
  force = true

# Rutas dinamicas: Expo pre-genera un HTML por cada una (vacante/[id].html,
# etc., con el bundle de la app incluido). Antes caian al index.html de abajo y
# se veia la landing un instante antes de la oferta; ahora cada una usa su
# propia pagina. Netlify sirve esos archivos con los corchetes codificados.
[[redirects]]
  from = "/vacante/*"
  to = "/vacante/%5Bid%5D.html"
  status = 200

[[redirects]]
  from = "/v/*"
  to = "/v/%5Bslug%5D.html"
  status = 200

[[redirects]]
  from = "/e/*"
  to = "/e/%5Bslug%5D.html"
  status = 200

[[redirects]]
  from = "/empresa/job/*"
  to = "/empresa/job/%5Bid%5D.html"
  status = 200

[[redirects]]
  from = "/empresa/invite/*"
  to = "/empresa/invite/%5Bcode%5D.html"
  status = 200

[[redirects]]
  from = "/encuesta/*"
  to = "/encuesta/%5Btipo%5D.html"
  status = 200

# Redirect rules for SPA
# Todo lo demas sin archivo estatico se sirve con index.html (SPA fallback).
# NOTA: se intento reemplazar esto por una pantalla de carga neutral
# (_shell.html) para evitar el flash de la landing, pero esa pagina no
# incluia el <script> del bundle de la app, dejando el spinner girando
# para siempre y rompiendo la postulacion en produccion. Revertido.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for better performance
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# El bundle JS/CSS de Expo lleva el hash del contenido en el nombre
# (entry-<hash>.js): cada deploy genera un archivo nuevo, asi que se puede
# cachear para siempre. Antes se revalidaba en cada visita (max-age=0).
[[headers]]
  for = "/_expo/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
