# Build settings
[build]
  command = "npm run build:web"
  publish = "dist"

[functions]
  directory = "netlify/functions"


[build.environment]
  # Firebase API keys are designed to be public (client-side)
  # They're protected by Firebase Security Rules, not by being secret
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

# Redirect /api/* to Netlify Functions (MUST be before SPA catch-all)
[[redirects]]
  from = "/api/auth"
  to = "/.netlify/functions/auth"
  status = 200
  force = true

[[redirects]]
  from = "/api/save-match"
  to = "/.netlify/functions/save-match"
  status = 200
  force = true

# Redirect rules for SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for better performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
