# Build settings
[build]
  command = "npm run build:web"
  publish = "dist"

[functions]
  directory = "netlify/functions"


[build.environment]
  # Firebase API keys are designed to be public (client-side)
  # They're protected by Firebase Security Rules, not by being secret
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

# Redirect /api/* to Netlify Functions (MUST be before SPA catch-all)
[[redirects]]
  from = "/api/auth"
  to = "/.netlify/functions/auth"
  status = 200
  force = true

[[redirects]]
  from = "/api/save-match"
  to = "/.netlify/functions/save-match"
  status = 200
  force = true

[[redirects]]
  from = "/api/analyze-linkedin"
  to = "/.netlify/functions/analyze-linkedin"
  status = 200
  force = true

[[redirects]]
  from = "/api/send-email"
  to = "/.netlify/functions/send-email"
  status = 200
  force = true

[[redirects]]
  from = "/api/subscribe"
  to = "/.netlify/functions/subscribe"
  status = 200
  force = true

# IMPORTANTE: las reglas de rutas dinamicas y el SPA fallback que realmente
# aplican estan en public/_redirects, que Netlify evalua ANTES que este archivo.
# (Por eso /api/* de arriba nunca llega a usarse: la app llama a
# /.netlify/functions/* directo.)
#
# Redirect rules for SPA
# NOTA: se intento reemplazar esto por una pantalla de carga neutral
# (_shell.html) para evitar el flash de la landing, pero esa pagina no
# incluia el <script> del bundle de la app, dejando el spinner girando
# para siempre y rompiendo la postulacion en produccion. Revertido.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for better performance
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# OJO: /_expo/static/* NO se puede cachear como "immutable". Expo calcula el
# hash de entry-<hash>.js sin incluir el mapa de chunks por ruta, asi que entre
# deploys el mismo nombre puede tener contenido distinto; con cache inmutable
# el navegador usaba un entry viejo que pedia chunks que ya no existian.
# Se deja el default de Netlify (revalida con ETag en cada visita).
