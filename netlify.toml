# Build settings
[build]
  command = "npm run build:web"
  publish = "dist"

[functions]
  directory = "netlify/functions"


[build.environment]
  # Firebase API keys are designed to be public (client-side)
  # They're protected by Firebase Security Rules, not by being secret
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

# Redirect /api/* to Netlify Functions (MUST be before SPA catch-all)
[[redirects]]
  from = "/api/auth"
  to = "/.netlify/functions/auth"
  status = 200
  force = true

[[redirects]]
  from = "/api/save-match"
  to = "/.netlify/functions/save-match"
  status = 200
  force = true

[[redirects]]
  from = "/api/analyze-linkedin"
  to = "/.netlify/functions/analyze-linkedin"
  status = 200
  force = true

[[redirects]]
  from = "/api/send-email"
  to = "/.netlify/functions/send-email"
  status = 200
  force = true

[[redirects]]
  from = "/api/subscribe"
  to = "/.netlify/functions/subscribe"
  status = 200
  force = true

# Redirect rules for SPA
# Rutas dinamicas (/vacante/[id], /v/[slug], /e/[slug], etc.) no existen como
# archivo estatico, asi que caen aca. Apunta a una pantalla de carga neutral
# en vez de a index.html: si no, Netlify mostraba brevemente el HTML de la
# landing principal (el que SI esta pre-generado) antes de que el JS cargara
# y React corrigiera la pantalla a la ruta real -- se veia como que "primero
# carga la landing y despues la oferta".
[[redirects]]
  from = "/*"
  to = "/_shell.html"
  status = 200

# Headers for better performance
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
