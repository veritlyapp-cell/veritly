name: Jules AI Agent
on:
  issues:
    types: [labeled]

jobs:
  jules-task:
    if: github.event.label.name == 'jules'
    runs-on: ubuntu-latest
    steps:
      - name: Invoke Jules
        uses: google-labs-code/jules-invoke@v1
        with:
          prompt: "Analiza el issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}. ${{ github.event.issue.body }}. Crea un Pull Request con la solución."
          api-key: ${{ secrets.JULES_API_KEY }}
